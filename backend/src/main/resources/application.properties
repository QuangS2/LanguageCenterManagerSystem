spring.application.name=backend

# MySQL Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/language_center?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Flyway Configuration for Database Migration
spring.flyway.locations=classpath:db/migration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

# JPA Configuration
# Disable Hibernate's automatic DDL (managed by Flyway)
spring.jpa.hibernate.ddl-auto=none
# Show SQL for debugging
spring.jpa.show-sql=true
# Format SQL for readability
spring.jpa.properties.hibernate.format_sql=true
# Log Hibernate SQL
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE
# Log Flyway
logging.level.org.flywaydb.core=DEBUG

spring.config.import=optional:classpath:application_secrets.properties
# Redis Configs
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.password=strongpassword123
spring.data.redis.timeout=60000

# Cache Configurations (Thời gian sống mặc định của cache)
app.cache.ttl.minutes=60
# Kafka Configs
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=language-center-group

# Key & Value Serializers/Deserializers
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer

# Set trusted packages for JSON deserialization
spring.kafka.consumer.properties.spring.json.trusted.packages=com.example.backend.dto.event
